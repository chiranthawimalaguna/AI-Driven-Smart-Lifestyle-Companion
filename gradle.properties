org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# Some Windows setups end up with non-ASCII characters (e.g. en dashes from
# copy-pasted folder names) in the project path, which trips Gradle's path
# check. This override is Google's own sanctioned fix for that - safe to leave on.
android.overridePathCheck=true
